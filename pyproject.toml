[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthound"
version = "0.1.0"
description = "BloodHound OpenGraph collector for AI agent attack paths"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
agenthound = "agenthound.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
